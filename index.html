<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Touch Error Experiment</title>

    <script type="module">
        import EmbeddedPageSdk from "https://app.realeye.io/sdk/js/testRunnerEmbeddableSdk-latest.js";
        window.addEventListener("DOMContentLoaded", () => {
            window.reSdk = new EmbeddedPageSdk(false, null, false);
        });
    </script>

    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #000; touch-action: none; }
        
        #experiment-screen { display: block; width: 100vw; height: 100vh; position: relative; }
        
        #grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 10px;
            padding: 20px;
            width: 100%;
            height: 80%;
            box-sizing: border-box;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .icon { background-color: #555; border-radius: 20%; margin: auto; transition: background-color 0.1s; }
        .target { background-color: #ff4757; box-shadow: 0 0 15px #ff4757; }
        
        #touch-feedback { position: absolute; width: 20px; height: 20px; background: rgba(255, 255, 255, 0.7); border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); z-index: 100; }

        #results-screen { display: none; padding: 20px; background: white; height: 100vh; box-sizing: border-box; color: black; }
        button { width: 100%; padding: 15px; font-size: 18px; color: white; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer;}
        button.export-btn { background-color: #28a745; }
    </style>
</head>
<body>
    
    <div id="experiment-screen">
        <div id="grid-container"></div>
        <div id="touch-feedback"></div>
    </div>

    <div id="results-screen">
        <h2>실험 종료</h2>
        <p id="result-summary"></p>
        <button class="export-btn" onclick="exportToCSV()">결과 CSV 다운로드</button>
    </div>

    <script>
        // 💡 핵심 추가 기능: 인터넷 주소창에서 '?size=숫자'를 읽어옵니다.
        const urlParams = new URLSearchParams(window.location.search);
        const sizeParam = urlParams.get('size');
        // 주소에 size 값이 있으면 그 숫자를 쓰고, 없으면 기본값 50을 씁니다.
        const iconSize = sizeParam ? parseInt(sizeParam) : 50; 
        
        const trialsTotal = 5; 
        
        let currentTrial = 0;
        let targetIndex = -1;
        let startTime = 0;
        let experimentData = [];

        const expScreen = document.getElementById('experiment-screen');
        const gridContainer = document.getElementById('grid-container');
        const feedback = document.getElementById('touch-feedback');
        const resultsScreen = document.getElementById('results-screen');

        window.onload = () => {
            gridContainer.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                let div = document.createElement('div');
                div.className = 'icon';
                div.style.width = iconSize + 'px';
                div.style.height = iconSize + 'px';
                div.dataset.index = i;
                gridContainer.appendChild(div);
            }
            
            expScreen.addEventListener('touchstart', handleTouch, {passive: false});
            setTimeout(nextTrial, 1500); 
        };

        function nextTrial() {
            if (currentTrial >= trialsTotal) {
                endExperiment();
                return;
            }

            if (targetIndex !== -1) {
                gridContainer.children[targetIndex].classList.remove('target');
            }

            targetIndex = Math.floor(Math.random() * 30);
            gridContainer.children[targetIndex].classList.add('target');

            currentTrial++;
            startTime = performance.now();
        }

        function handleTouch(e) {
            e.preventDefault(); 
            if (targetIndex === -1) return; 

            let touchTime = performance.now();
            let reactionTime = touchTime - startTime;
            let touch = e.touches[0];
            let tx = touch.clientX;
            let ty = touch.clientY;

            feedback.style.left = tx + 'px';
            feedback.style.top = ty + 'px';
            feedback.style.display = 'block';
            setTimeout(() => feedback.style.display = 'none', 100);

            let targetEl = gridContainer.children[targetIndex];
            let rect = targetEl.getBoundingClientRect();
            let cx = rect.left + (rect.width / 2);
            let cy = rect.top + (rect.height / 2);
            let radius = rect.width / 2; 
            
            let distanceToCenter = Math.sqrt(Math.pow(tx - cx, 2) + Math.pow(ty - cy, 2));
            let errorDistance = Math.max(0, distanceToCenter - radius);
            let isHit = errorDistance === 0;

            experimentData.push({
                trial: currentTrial,
                iconSize: iconSize,
                reactionTime_ms: Math.round(reactionTime),
                errorDistance_px: errorDistance.toFixed(2),
                isHit: isHit
            });

            targetIndex = -1; 
            targetEl.classList.remove('target');

            let randomDelay = Math.random() * 1000 + 500;
            setTimeout(nextTrial, randomDelay);
        }

        function endExperiment() {
            expScreen.removeEventListener('touchstart', handleTouch);
            expScreen.style.display = 'none';
            document.body.style.backgroundColor = 'white'; 
            resultsScreen.style.display = 'block';
            
            let totalHit = experimentData.filter(d => d.isHit).length;
            let avgTime = experimentData.reduce((sum, d) => sum + d.reactionTime_ms, 0) / trialsTotal;
            
            document.getElementById('result-summary').innerHTML = 
                `아이콘 크기: ${iconSize}px <br> 총 시도: ${trialsTotal}회 <br> 명중률: ${Math.round((totalHit/trialsTotal)*100)}% <br> 평균 반응속도: ${Math.round(avgTime)}ms`;
        }

        function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            csvContent += "Trial,Icon Size(px),Reaction Time(ms),Error Distance(px),Hit/Miss\n";
            
            experimentData.forEach(function(rowArray) {
                let row = `${rowArray.trial},${rowArray.iconSize},${rowArray.reactionTime_ms},${rowArray.errorDistance_px},${rowArray.isHit ? 'Hit' : 'Miss'}`;
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `touch_experiment_size_${iconSize}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
